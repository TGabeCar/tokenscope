[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tokenscope"
version = "0.1.0"
description = "A terminal dashboard for Claude Code token usage and estimated cost."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabe" }]
requires-python = ">=3.10"
dependencies = ["rich>=13.0"]
keywords = ["claude", "claude-code", "tokens", "cli", "rich", "dashboard"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/TGabeCar/tokenscope"
Issues = "https://github.com/TGabeCar/tokenscope/issues"

[project.scripts]
tokenscope = "tokenscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
